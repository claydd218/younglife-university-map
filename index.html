<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Young Life University International Ministries</title>
<meta name="description" content="An interactive world map of Young Life University's international ministry sites — cities, universities, and staff reaching college students around the world, with a nod to Brett Rodgers.">
<meta name="theme-color" content="#16385c">
<meta name="keywords" content="Young Life, Young Life University, international ministry, college ministry map, Brett Rodgers">
<link rel="canonical" href="https://yl-uni-intl.com/">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="YL Intl Uni">

<meta property="og:type" content="website">
<meta property="og:title" content="Young Life University International Ministries">
<meta property="og:description" content="An interactive world map of Young Life University's international ministry sites — cities, universities, and staff reaching college students around the world, with a nod to Brett Rodgers.">
<meta property="og:url" content="https://yl-uni-intl.com/">
<meta property="og:image" content="https://yl-uni-intl.com/maps/world.png">
<meta property="og:image:alt" content="World map of Young Life University's international ministry sites">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Young Life University International Ministries">
<meta name="twitter:description" content="An interactive world map of Young Life University's international ministry sites — cities, universities, and staff reaching college students around the world, with a nod to Brett Rodgers.">
<meta name="twitter:image" content="https://yl-uni-intl.com/maps/world.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet-markercluster/MarkerCluster.css">
<link rel="stylesheet" href="vendor/leaflet-markercluster/MarkerCluster.Default.css">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 id="site-title"><span class="title-part">Young Life University</span> <span class="title-part">International Ministries</span></h1>
    <div id="metrics-overlay" class="metrics-overlay" aria-hidden="true">
      <div id="metrics-label" class="metrics-label" hidden></div>
      <div id="metrics-boxes" class="metrics-boxes"></div>
    </div>
  </header>

  <div id="map"></div>

  <div class="paper-grain" aria-hidden="true"></div>

  <button id="nav-menu-toggle" class="nav-menu-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="nav-menu" aria-label="Choose view">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
      <line x1="3" y1="5.5" x2="17" y2="5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="3" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="3" y1="14.5" x2="17" y2="14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="nav-menu" class="nav-menu" hidden>
    <ul id="nav-menu-list" class="nav-menu-list"></ul>
  </div>

  <svg class="compass-rose" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="52" fill="none" stroke="#5a4a34" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="44" fill="none" stroke="#5a4a34" stroke-width="0.75"/>
    <g stroke="#5a4a34" stroke-width="1">
      <line x1="60" y1="8"  x2="60" y2="112"/>
      <line x1="8"  y1="60" x2="112" y2="60"/>
      <line x1="24" y1="24" x2="96" y2="96"/>
      <line x1="96" y1="24" x2="24" y2="96"/>
    </g>
    <polygon points="60,14 66,60 60,50 54,60" fill="#5a4a34"/>
    <polygon points="60,106 66,60 60,70 54,60" fill="#8a7a5e"/>
    <text x="60" y="26" text-anchor="middle" font-size="11" fill="#3b2a1a" font-family="Cinzel, serif">N</text>
    <text x="60" y="102" text-anchor="middle" font-size="9" fill="#3b2a1a" font-family="Cinzel, serif">S</text>
    <text x="16" y="64" text-anchor="middle" font-size="9" fill="#3b2a1a" font-family="Cinzel, serif">W</text>
    <text x="104" y="64" text-anchor="middle" font-size="9" fill="#3b2a1a" font-family="Cinzel, serif">E</text>
  </svg>

  <aside id="legend" class="legend">
    <div id="legend-swipe-zone" class="legend-swipe-zone">
      <div class="legend-handle" aria-hidden="true"></div>
      <div class="legend-header">
        <h2 class="legend-title">Legend</h2>
        <button id="legend-toggle" class="legend-toggle" type="button" aria-expanded="true" aria-label="Minimize legend">
          <svg class="chevron-icon" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <polyline points="2,4 7,9 12,4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="legend-body" class="legend-body">
      <h3>Ministry Stage</h3>
      <ul id="legend-stages"></ul>
    </div>
  </aside>

  <div id="directory-modal" class="directory-modal" hidden>
    <div class="directory-card" role="dialog" aria-modal="true" aria-labelledby="directory-title">
      <div class="directory-header">
        <h2 id="directory-title">Ministries by Country</h2>
        <button id="directory-close" class="directory-close" type="button" aria-label="Close">&times;</button>
      </div>
      <input id="directory-search" class="directory-search" type="text" placeholder="Search country, city, staff, or university…" autocomplete="off">
      <div id="directory-list" class="directory-list"></div>
    </div>
  </div>

  <div id="status" class="status-banner" hidden></div>

  <img id="photo-preview" class="photo-preview" alt="" aria-hidden="true">

  <div id="ministry-lightbox" class="ministry-lightbox" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <!-- Only ever populated for the ?tour=NAME tour (see tourGoToPin/
         tourPinCaptionHtml in js/app.js and window.__ministryLightbox's
         own openFromPoint) — a real visitor's own click-to-open never
         passes a caption, so this stays empty/hidden for them. Sits below
         the active photo (positioned by JS — applySlideSize — to match
         its current left/width, so the two read as one card), fading in/
         out on its own rather than animating alongside it: a `transform`
         on an ancestor becomes the containing block for a
         `position:fixed` descendant (a CSS rule, not a bug), which is
         exactly what broke this the first time it lived inside
         .lightbox-content while that element's own transform animated —
         see openFromPoint's own comment. As a plain sibling here, its
         position is never touched by whatever transform the photo itself
         is mid-animation with. -->
    <div class="lightbox-tour-caption" hidden></div>
    <div class="lightbox-content">
      <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
      <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous photo">&#10094;</button>
      <div class="lightbox-viewport">
        <img class="lightbox-slide" data-slide="a" alt="">
        <img class="lightbox-slide" data-slide="b" alt="">
      </div>
      <button type="button" class="lightbox-nav lightbox-next" aria-label="Next photo">&#10095;</button>
      <div class="lightbox-dots"></div>
    </div>
  </div>

  <!-- Separate from #ministry-lightbox rather than a "video slide" bolted
       onto the photo carousel — a video never swipes/spiderfies between
       multiple items the way photos do, so sharing that machinery would
       mean threading video-specific cases through logic that doesn't
       otherwise need to know videos exist. -->
  <div id="video-lightbox" class="ministry-lightbox" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content video-lightbox-content">
      <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
      <div class="video-embed-wrap" id="video-lightbox-embed"></div>
    </div>
  </div>

  <!-- Full-viewport, invisible, present only while body.tour-active (i.e.
       actively playing — see playTour/pauseTour/endTourInPlace in
       js/app.js) — swallows every click/drag/scroll aimed at the map,
       lightbox dots, or anything else underneath so a visitor can't
       divert a playing tour, while sitting below #tour-controls'
       z-index so those buttons stay reachable. No JS needed: shown/
       hidden purely by the same body.tour-active class already driving
       everything else tour-related. -->
  <div id="tour-click-shield" aria-hidden="true"></div>

  <!-- hidden="" here is just the pre-JS/no-JS fallback — initTourControls
       (js/app.js) unhides this on every load, defaulting to the World
       tour unless ?tour=NAME picks a specific division, and picking
       World/a division from #nav-menu afterward re-targets it the same
       way (see activateTourControls). -->
  <!-- Plain hand-drawn SVGs (same convention as the hamburger/compass-rose/
       video-play icons above), not the Unicode glyphs these four used to
       be — those rendered at wildly different visual sizes/baselines
       (▶/❚❚ vs ■/↻) at the same font-size, a font-metrics quirk with no
       clean CSS-only fix. fill="currentColor"/stroke="currentColor" keeps
       each icon following .tour-control-btn's own color (including its
       hover and #tour-loop-btn.active states) same as color did before. -->
  <div id="tour-controls" class="tour-controls" hidden>
    <button type="button" id="tour-play-btn" class="tour-control-btn" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,5 19,12 7,19" fill="currentColor"/></svg>
    </button>
    <!-- Pause removed for now (problematic — see js/app.js's pauseTour,
         left in place since the button is the only thing pulled out
         here) — may come back later. -->
    <button type="button" id="tour-loop-btn" class="tour-control-btn" aria-label="Loop" aria-pressed="false">
      <!-- True circle, split into two symmetric 120° arcs with a real
           60° gap on each side (up from the first two-arrow attempt's
           30°) — one arrowhead each, stroke-based/thin like the
           original single-arrow refresh icon this started as. Each
           arrowhead is a properly constructed triangle aligned to the
           arc's own tangent direction at that endpoint (computed, not
           eyeballed — the previous attempt's triangles weren't actually
           tangent to the curve, which read as "angled oddly"). The
           bottom arc + arrowhead is exactly the top one rotated 180°
           about the icon's own center. -->
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M5.07,8 A8,8 0 0 1 18.93,8"/>
        <polygon points="20.9,11.5 16.3,9.5 21.5,6.5" fill="currentColor" stroke="none"/>
        <path d="M18.93,16 A8,8 0 0 1 5.07,16"/>
        <polygon points="3.1,12.5 7.7,14.5 2.5,17.5" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button type="button" id="tour-stop-btn" class="tour-control-btn" aria-label="Stop tour">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>
    </button>
    <!-- Disabled while playing, same as Play — see updateTourControlsUI.
         Standard gear/cog glyph, same stroke-based convention as Loop
         above (not a filled shape like Play/Stop, since it has to read
         as "configure" rather than "action"). -->
    <button type="button" id="tour-settings-btn" class="tour-control-btn" aria-label="Tour settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 8a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V8a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- Tour settings dialog — same .directory-modal/.directory-card/
       .directory-header/.directory-close pattern the search directory
       (#directory-modal above) already uses, for a consistent look
       without a second set of dialog styles. Populated/wired entirely
       by js/app.js's wireTourSettingsDialog; #tour-settings-countries-
       field is hidden outright for a World tour (currentTourDivisionKeys
       spanning more than one division) per the user's own spec. -->
  <div id="tour-settings-modal" class="directory-modal" hidden>
    <div class="directory-card" role="dialog" aria-modal="true" aria-labelledby="tour-settings-title">
      <div class="directory-header">
        <h2 id="tour-settings-title">Tour Settings</h2>
        <button id="tour-settings-close" class="directory-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="tour-settings-body">
        <div class="tour-settings-field">
          <!-- Five discrete notches (TOUR_SPEED_STEPS in js/app.js), not a
               true continuous slider — a native range input with step=1
               snapping between them is the simplest way to get that,
               without inventing a custom-drawn slider control. -->
          <span class="tour-settings-label">Tour Speed: <span id="tour-setting-speed-value"></span></span>
          <input type="range" id="tour-setting-speed" class="tour-settings-slider" min="0" max="4" step="1">
          <div class="tour-settings-slider-ends"><span>Slow</span><span>Fast</span></div>
        </div>
        <div class="tour-settings-field">
          <span class="tour-settings-label">Photos Per Pin</span>
          <div class="tour-settings-options" id="tour-setting-photos-per-pin"></div>
        </div>
        <div class="tour-settings-field">
          <!-- Disabled (not hidden) whenever Photos Per Pin is None — see
               renderTourSettingsDialog — since there's nothing to time,
               though the stored value still quietly governs how long the
               no-photo pause itself lasts (tourPhotoDwellSeconds). -->
          <span class="tour-settings-label">Photo Display Length</span>
          <div class="tour-settings-options" id="tour-setting-photo-seconds"></div>
        </div>
        <div class="tour-settings-field" id="tour-settings-countries-field">
          <span class="tour-settings-label">Select Countries</span>
          <div class="tour-settings-country-actions">
            <button type="button" id="tour-settings-countries-all" class="btn-link">Check All</button>
            <button type="button" id="tour-settings-countries-none" class="btn-link">Check None</button>
          </div>
          <ul class="tour-settings-country-list" id="tour-settings-country-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-markercluster/leaflet.markercluster.js"></script>
  <script src="vendor/papaparse/papaparse.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
