<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Young Life University International Ministries</title>
<meta name="description" content="An interactive world map of Young Life University's international ministry sites — cities, universities, and staff reaching college students around the world, with a nod to Brett Rodgers.">
<meta name="theme-color" content="#16385c">
<meta name="keywords" content="Young Life, Young Life University, international ministry, college ministry map, Brett Rodgers">
<link rel="canonical" href="https://yl-uni-intl.com/">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="YL Intl Uni">

<meta property="og:type" content="website">
<meta property="og:title" content="Young Life University International Ministries">
<meta property="og:description" content="An interactive world map of Young Life University's international ministry sites — cities, universities, and staff reaching college students around the world, with a nod to Brett Rodgers.">
<meta property="og:url" content="https://yl-uni-intl.com/">
<meta property="og:image" content="https://yl-uni-intl.com/maps/world.png">
<meta property="og:image:alt" content="World map of Young Life University's international ministry sites">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Young Life University International Ministries">
<meta name="twitter:description" content="An interactive world map of Young Life University's international ministry sites — cities, universities, and staff reaching college students around the world, with a nod to Brett Rodgers.">
<meta name="twitter:image" content="https://yl-uni-intl.com/maps/world.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 id="site-title">Young Life University International Ministries</h1>
  </header>

  <div id="map"></div>

  <div class="frame-border" aria-hidden="true"></div>
  <div class="paper-grain" aria-hidden="true"></div>

  <svg class="compass-rose" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="52" fill="none" stroke="#5a4a34" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="44" fill="none" stroke="#5a4a34" stroke-width="0.75"/>
    <g stroke="#5a4a34" stroke-width="1">
      <line x1="60" y1="8"  x2="60" y2="112"/>
      <line x1="8"  y1="60" x2="112" y2="60"/>
      <line x1="24" y1="24" x2="96" y2="96"/>
      <line x1="96" y1="24" x2="24" y2="96"/>
    </g>
    <polygon points="60,14 66,60 60,50 54,60" fill="#5a4a34"/>
    <polygon points="60,106 66,60 60,70 54,60" fill="#8a7a5e"/>
    <text x="60" y="26" text-anchor="middle" font-size="11" fill="#3b2a1a" font-family="Cinzel, serif">N</text>
    <text x="60" y="102" text-anchor="middle" font-size="9" fill="#3b2a1a" font-family="Cinzel, serif">S</text>
    <text x="16" y="64" text-anchor="middle" font-size="9" fill="#3b2a1a" font-family="Cinzel, serif">W</text>
    <text x="104" y="64" text-anchor="middle" font-size="9" fill="#3b2a1a" font-family="Cinzel, serif">E</text>
  </svg>

  <aside id="legend" class="legend">
    <div id="legend-swipe-zone" class="legend-swipe-zone">
      <div class="legend-handle" aria-hidden="true"></div>
      <div class="legend-header">
        <h2 class="legend-title">Legend</h2>
        <button id="legend-toggle" class="legend-toggle" type="button" aria-expanded="true" aria-label="Minimize legend">
          <svg class="chevron-icon" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <polyline points="2,4 7,9 12,4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="legend-body" class="legend-body">
      <h3>Divisions</h3>
      <ul id="legend-divisions"></ul>

      <h3>Ministry Stage</h3>
      <ul id="legend-stages"></ul>
    </div>
  </aside>

  <div id="directory-modal" class="directory-modal" hidden>
    <div class="directory-card" role="dialog" aria-modal="true" aria-labelledby="directory-title">
      <div class="directory-header">
        <h2 id="directory-title">Ministries by Country</h2>
        <button id="directory-close" class="directory-close" type="button" aria-label="Close">&times;</button>
      </div>
      <input id="directory-search" class="directory-search" type="text" placeholder="Search countries…" autocomplete="off">
      <div id="directory-list" class="directory-list"></div>
    </div>
  </div>

  <div id="status" class="status-banner" hidden></div>

  <img id="photo-preview" class="photo-preview" alt="" aria-hidden="true">

  <div id="ministry-lightbox" class="ministry-lightbox" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
      <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous photo">&#10094;</button>
      <div class="lightbox-viewport">
        <div class="lightbox-track">
          <img class="lightbox-slide" data-slide="prev" alt="">
          <img class="lightbox-slide" data-slide="current" alt="">
          <img class="lightbox-slide" data-slide="next" alt="">
        </div>
      </div>
      <button type="button" class="lightbox-nav lightbox-next" aria-label="Next photo">&#10095;</button>
      <div class="lightbox-dots"></div>
    </div>
  </div>

  <!-- Separate from #ministry-lightbox rather than a "video slide" bolted
       onto the photo carousel — a video never swipes/spiderfies between
       multiple items the way photos do, so sharing that machinery would
       mean threading video-specific cases through logic that doesn't
       otherwise need to know videos exist. -->
  <div id="video-lightbox" class="ministry-lightbox" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content video-lightbox-content">
      <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
      <div class="video-embed-wrap" id="video-lightbox-embed"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
