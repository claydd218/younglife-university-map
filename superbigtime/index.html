<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>superbigtime — Admin Users</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<style>
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 720px;
    margin: 32px auto;
    padding: 0 20px 80px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }

  .btn {
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border: 1px solid #1a1a1a;
    border-radius: 5px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: #333; }
  .btn.secondary { background: #fff; color: #1a1a1a; }
  .btn.secondary:hover { background: #f0f0f0; }
  .btn.danger { background: #a33; border-color: #a33; }
  .btn.danger:hover { background: #8a2c22; }
  .btn-small { font-size: 12.5px; padding: 5px 10px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; font-size: 13.5px; border-bottom: 1px solid #eee; }
  th { background: #f4f4f4; font-weight: 600; color: #444; }
  tr:last-child td { border-bottom: none; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { margin-left: 6px; }
  .status-text { color: #666; font-size: 13.5px; }

  .banner { padding: 12px 16px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
  .banner.error { background: #fdecea; border: 1px solid #f3b6b0; color: #8a2c22; }
  .banner.info { background: #eef4fb; border: 1px solid #bcd6ef; color: #1a4b7a; }
  .banner[hidden] { display: none; }

  dialog#user-dialog { width: min(420px, 92vw); border: 1px solid #ccc; border-radius: 8px; padding: 0; }
  dialog#user-dialog::backdrop { background: rgba(0,0,0,0.4); }
  dialog#user-dialog form { padding: 20px; }
  dialog#user-dialog h2 { font-size: 17px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; }
  .field input {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
  }
  .field-hint { font-size: 12px; color: #888; margin-top: 4px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="page-header">
    <div>
      <h1>superbigtime</h1>
      <div class="subtitle">Admin user accounts for /bigtime/</div>
    </div>
    <button type="button" class="btn secondary" id="sign-out-btn">Sign out</button>
  </div>

  <div id="banner" class="banner" hidden></div>

  <div class="toolbar">
    <span id="users-count" class="status-text"></span>
    <button type="button" class="btn" id="add-user-btn">+ Add User</button>
  </div>

  <table>
    <thead>
      <tr><th>Name</th><th>Login</th><th>Last login</th><th></th></tr>
    </thead>
    <tbody id="users-tbody"></tbody>
  </table>

  <dialog id="user-dialog">
    <form id="user-form" method="dialog">
      <h2 id="dialog-title">Add User</h2>
      <div id="dialog-banner" class="banner error" hidden></div>
      <div class="field">
        <label for="field-name">Name</label>
        <input type="text" id="field-name" required>
      </div>
      <div class="field">
        <label for="field-login">Login</label>
        <input type="text" id="field-login" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="field-password">Password</label>
        <input type="password" id="field-password" autocomplete="new-password">
        <div class="field-hint" id="password-hint"></div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn secondary" id="dialog-cancel-btn">Cancel</button>
        <button type="submit" class="btn" id="dialog-save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="admin.js"></script>
</body>
</html>
