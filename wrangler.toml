name = "younglife-university-map"
main = "worker/index.js"
compatibility_date = "2024-09-23"
# Required by @cloudflare/puppeteer's dependency chain, which imports
# Node.js built-ins (e.g. node:buffer) even on code paths this Worker
# doesn't actually exercise — without this flag the whole deploy fails
# validation with "No such module 'node:buffer'" before the Worker ever
# runs, not just the report-screenshot route specifically.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"
# Without this, Cloudflare serves any request matching an actual static
# file (bigtime/index.html, bigtime/login.html, bigtime/admin.js) directly,
# WITHOUT ever invoking the Worker — meaning worker/index.js's login check
# never ran for the admin page itself, only for /bigtime/api/* calls (which
# have no matching file, so they already reached the Worker by default).
# That was a real bug found in production: the page loaded with no login
# prompt at all, then its API calls correctly 401'd. run_worker_first=true
# forces every request through the Worker; worker/index.js already
# explicitly falls through to env.ASSETS.fetch() for anything that isn't
# /bigtime/*, so this doesn't change how the public map is served.
#
# Could not verify this specific setting against a local `wrangler dev` —
# both the array and boolean forms hit an unrelated wrangler-internal
# "middleware-loader.entry.ts" codegen bug locally (reproduced identically
# across a full .wrangler cache wipe, likely tied to this environment's
# wrangler/Node version) — but the actual Cloudflare Workers Builds CI
# pipeline that deploys this repo is a different toolchain and had already
# built/deployed successfully without this setting, so verified by
# deploying to the preview URL and testing there instead.
run_worker_first = true

# Used by worker/routes/report-screenshot.js to capture the live public map
# for the /bigtime/reports PDF. Requires Browser Rendering to be available
# on this Cloudflare account — not something verifiable from a local
# checkout; if the screenshot route 500s after deploy, check the Cloudflare
# dashboard for whether Browser Rendering needs enabling first.
[browser]
binding = "BROWSER"

# Used by worker/lib/loginRateLimit.js to back the login lockout counter
# (see that file for why it's a global counter, not per-IP). Every
# read/write there already checks for this binding's existence and
# fails open if it's missing, so an unset/misconfigured namespace here
# degrades to "no rate limiting" rather than breaking login.
[[kv_namespaces]]
binding = "LOGIN_ATTEMPTS"
id = "3275a550019a47559e2d529d30de9a1d"

# Ministry/staff data — replaces worker/lib/github.js (data/ministries.csv)
# as the app's persistence layer. See worker/lib/db/*.js. Named "DB", not
# the project name, since it's the only database this Worker has.
[[d1_databases]]
binding = "DB"
database_name = "younglife-map-db"
database_id = "aa079f07-abaf-4501-a2ef-38c08304b145"

# Photos, generated maps, and generated PDF reports — replaces
# worker/lib/github.js (images/, maps/, reports/) as the app's blob
# storage. Served back out through worker/routes/media.js, not public R2
# access — see that file's own comment for why. Named "MEDIA", not "R2",
# to avoid any ambiguity with the "ASSETS" static-assets binding above.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "younglife-map-media"

# Backup target for uploaded staff/ministry photos only (worker/lib/
# imageBackup.js) — maps/*.png and reports/*.pdf are deliberately not
# backed up here since both regenerate automatically from D1 data
# whenever needed, so losing them costs nothing. Every distinct version
# of a photo that's ever existed (by content, not just the latest one) is
# kept — see imageBackup.js's own comment for why a bad crop/replace
# needs the same protection as an outright deletion, and a plain mirror
# wouldn't give either.
[[r2_buckets]]
binding = "MEDIA_BACKUP"
bucket_name = "younglife-map-media-backup"

# Runs worker/index.js's scheduled() handler once a day.
[triggers]
crons = ["0 8 * * *"]
