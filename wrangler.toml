name = "younglife-university-map"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "."
binding = "ASSETS"
# No run_worker_first: both the array and boolean forms hit the same
# wrangler-internal "middleware-loader.entry.ts" codegen error in local dev
# (a wrangler bug, not a config mistake — reproduced identically across
# both forms and a full .wrangler cache wipe). Relying on the default
# behavior instead: static assets are served first automatically, and the
# Worker only runs for a request that doesn't match any file — which every
# /admin/api/* path already satisfies, since no such static file exists.
