<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login — Young Life University International Ministries</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<style>
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 360px;
    margin: 18vh auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 20px; margin-bottom: 18px; }
  form {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px;
  }
  input[type="password"] {
    width: 100%;
    font: inherit;
    font-size: 15px;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 9px 14px;
    border: 1px solid #1a1a1a;
    border-radius: 5px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #333; }
  .error {
    color: #a33;
    font-size: 13.5px;
    margin-bottom: 12px;
  }
  .error[hidden] { display: none; }
  .cf-turnstile { margin-bottom: 12px; }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <h1>Admin Login</h1>
  <form method="POST" action="/bigtime/api/login">
    <div class="error" id="error" hidden>Login failed — check your password and try again.</div>
    <input type="password" name="password" placeholder="Password" autofocus required>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEV3Hr6PnCCyLUxb"></div>
    <button type="submit">Log in</button>
  </form>
  <script src="login.js"></script>
</body>
</html>
