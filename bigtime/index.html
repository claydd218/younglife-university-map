<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Young Life University International Ministries</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px 80px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .help-link {
    font-size: 17px;
    color: #888;
    text-decoration: none;
    vertical-align: middle;
    margin-left: 4px;
  }
  .help-link:hover { color: #1a1a1a; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid #ddd;
  }
  .tab-btn {
    font: inherit;
    font-size: 14px;
    padding: 10px 16px;
    border: none;
    background: none;
    color: #666;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 600; }
  .tab-panel[hidden] { display: none; }

  .banner {
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .banner.info { background: #eef4fb; border: 1px solid #bcd6ef; color: #1a4b7a; }
  .banner.error { background: #fdecea; border: 1px solid #f3b6b0; color: #8a2c22; }
  .banner.conflict { background: #fff6e5; border: 1px solid #f0d488; color: #7a5a1a; }
  .banner button {
    font: inherit;
    font-size: 13px;
    margin-left: 10px;
    padding: 4px 10px;
    border: 1px solid currentColor;
    border-radius: 4px;
    background: none;
    color: inherit;
    cursor: pointer;
  }
  .banner[hidden] { display: none; }

  /* Non-modal — sits in a corner rather than blocking the toolbar like
     .banner, since publishing status isn't urgent enough to demand
     attention and the user should be free to keep editing while it
     resolves in the background. */
  .deploy-toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 10px 14px;
    border-radius: 8px;
    background: #b85c1e;
    color: #fff;
    font-size: 13.5px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .deploy-toast[hidden] { display: none; }
  .deploy-toast.done { background: #1e7a3c; }
  .deploy-toast-spinner {
    width: 13px;
    height: 13px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: deploy-toast-spin 0.7s linear infinite;
    flex: 0 0 auto;
  }
  .deploy-toast.done .deploy-toast-spinner { display: none; }
  @keyframes deploy-toast-spin { to { transform: rotate(360deg); } }
  .deploy-toast-dismiss {
    font: inherit;
    font-size: 16px;
    line-height: 1;
    padding: 0 0 0 4px;
    border: none;
    background: none;
    color: rgba(255,255,255,0.7);
    cursor: pointer;
  }
  .deploy-toast-dismiss:hover { color: #fff; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .toolbar-left { display: flex; align-items: center; gap: 12px; }
  .ministries-search-wrap { position: relative; display: flex; align-items: center; }
  .ministries-search {
    font: inherit;
    font-size: 14px;
    padding: 7px 26px 7px 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 240px;
    box-sizing: border-box;
  }
  .ministries-search-clear {
    position: absolute;
    right: 6px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    background: none;
    color: #888;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
  }
  .ministries-search-clear:hover { background: #eee; color: #333; }
  .btn {
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border: 1px solid #1a1a1a;
    border-radius: 5px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: #333; }
  .btn.secondary { background: #fff; color: #1a1a1a; }
  .btn.secondary:hover { background: #f0f0f0; }
  .btn.danger { background: #a33; border-color: #a33; }
  .btn.danger:hover { background: #8a2c22; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; font-size: 13.5px; border-bottom: 1px solid #eee; }
  th { background: #f4f4f4; font-weight: 600; color: #444; }
  tr:last-child td { border-bottom: none; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { margin-left: 6px; }
  .btn-small { font-size: 12.5px; padding: 5px 10px; }

  /* max-height alone isn't enough — <dialog> has no overflow rule by
     default, so once content (e.g. several staff/university rows) pushes
     past it, the dialog itself starts scrolling as a whole instead of just
     .dialog-body, dragging the header out of view. Flexing the dialog and
     its form wrapper, with the body as the only flexible/scrolling child,
     means the body always gets exactly "whatever's left" under the header
     — no guessing the header's height with a magic-number calc().  */
  dialog#ministry-dialog {
    width: min(760px, 94vw);
    max-height: 88vh;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 0;
    overflow: hidden;
  }
  /* The ID selector above already outranks the UA stylesheet's
     dialog:not([open]) { display: none }, so display:flex has to be
     conditioned on [open] here too — otherwise the dialog stays laid
     out (just invisible-looking, pushed below the fold) even when
     closed, instead of actually being removed from flow. */
  dialog#ministry-dialog[open] { display: flex; }
  dialog#ministry-dialog::backdrop { background: rgba(0,0,0,0.4); }
  #ministry-form { display: flex; flex-direction: column; min-height: 0; width: 100%; }
  .dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    flex: 0 0 auto;
  }
  .dialog-header h2 { font-size: 17px; margin: 0; }
  .dialog-header-actions { display: flex; gap: 8px; }
  .dialog-body { padding: 16px 20px 28px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }

  /* Same "only display:flex under [open]" approach as #ministry-dialog —
     this one has no unconditional display rule to begin with, so no
     override is needed, but keeping it scoped to [open] here too avoids
     the same trap if properties ever get added outside that selector. */
  dialog#move-staff-dialog {
    width: min(420px, 92vw);
    max-height: 80vh;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 0;
    overflow: hidden;
  }
  dialog#move-staff-dialog[open] { display: flex; flex-direction: column; }
  dialog#move-staff-dialog::backdrop { background: rgba(0,0,0,0.4); }
  .move-staff-search {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    margin-bottom: 10px;
  }
  .move-staff-list { display: flex; flex-direction: column; gap: 4px; }
  .move-staff-option {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 14px;
    padding: 9px 11px;
    border: 1px solid #eee;
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
  }
  .move-staff-option:hover { background: #f4f4f4; border-color: #ccc; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; }
  .field-checkbox label { display: flex; align-items: center; gap: 8px; font-weight: 400; margin-bottom: 0; }
  .field-checkbox input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: #1a1a1a; }
  .field input[type="text"], .field input[type="number"], .field textarea, .field input[list] {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
  }
  .field textarea { min-height: 70px; resize: none; }
  .field-error { color: #a33; font-size: 12.5px; margin-top: 3px; }
  .latlng-lookup { display: flex; align-items: center; gap: 10px; margin: -6px 0 12px; }
  .latlng-lookup-status { font-size: 12.5px; color: #666; }
  .latlng-lookup-status.error { color: #a33; }
  .pin-placement-btn-col { flex: 0 0 auto; }
  .pin-placement-map {
    height: 260px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin: 6px 0 12px;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .repeatable-group { border: 1px solid #e5e5e5; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
  .repeatable-group:empty { display: none; }
  /* Stacked (name, then role, full-width each) rather than side by side —
     splitting the row in half left both fields too cramped for a full
     name/title. */
  .repeatable-item { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid #ddd; }
  .repeatable-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .repeatable-item .field { flex: none; width: 100%; margin-bottom: 0; }
  .repeatable-item .remove-row { align-self: flex-end; }
  .staff-row-actions { display: flex; gap: 8px; align-self: flex-end; }

  .photo-widget {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: start;
    gap: 14px;
    border: 1px dashed #ccc;
    border-radius: 6px;
    padding: 10px;
    margin-top: 6px;
    font-size: 12.5px;
    color: #666;
  }
  .photo-widget.dragover { background: #eef4fb; border-color: #7aa8d8; }
  .photo-widget img.photo-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 50%; border: 1px solid #ccc; cursor: zoom-in; }
  .photo-widget .photo-placeholder { width: 44px; height: 44px; border-radius: 50%; background: #eee; }

  .photo-zoom-row { grid-column: 1 / -1; margin-top: 4px; }
  .photo-zoom-row img { display: block; max-width: 100%; max-height: 320px; object-fit: contain; border-radius: 4px; border: 1px solid #ccc; cursor: zoom-out; }

  .photo-col-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding-top: 2px; font-size: 14px; }
  .photo-col-info .dims { margin-left: 0; font-size: 13px; }
  .photo-hint { font-size: 12.5px; }
  .photo-hint.warning { color: #8a6500; }
  .photo-hint.neutral { color: #888; }

  .photo-col-replace { display: flex; flex-direction: column; gap: 4px; white-space: nowrap; text-align: right; }
  .replace-row { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .replace-status {
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 4px;
    border: 1px solid transparent;
  }
  .replace-status.uploading { color: #1a4b7a; background: #eef4fb; border-color: #bcd6ef; }
  .replace-status.error { color: #8a2c22; background: #fdecea; border-color: #f3b6b0; }
  .hidden-file-input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* --- Ministry photos (multi-photo manager) --- */
  .ministry-photos-dropzone {
    border: 1px dashed #ccc;
    border-radius: 6px;
    padding: 10px;
    margin-top: 6px;
  }
  .ministry-photos-dropzone.dragover { background: #eef4fb; border-color: #7aa8d8; }
  .ministry-photos-add-row { display: flex; align-items: center; gap: 10px; }
  .ministry-photos-drop-hint { font-size: 12.5px; color: #888; }
  .ministry-photos { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .ministry-photo-empty { font-size: 13px; color: #888; padding: 4px 2px; }
  .ministry-photo-item {
    display: grid;
    grid-template-columns: 140px 1fr auto;
    align-items: center;
    gap: 14px;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .ministry-photo-item img {
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  .ministry-photo-main-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #1e7a3c;
    background: #eafaf0;
    border: 1px solid #bfe8cc;
    border-radius: 4px;
    padding: 2px 7px;
    width: fit-content;
  }
  .ministry-photo-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .ministry-photo-reorder { display: flex; gap: 4px; }
  .ministry-photo-reorder .btn { padding: 5px 9px; }
  .ministry-photo-hint { font-size: 12.5px; color: #888; margin-top: 2px; }

  /* --- Images tab --- */
  .summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .guidance {
    background: #eef4fb;
    border: 1px solid #bcd6ef;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 13px;
    color: #1a4b7a;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .filter-toggle {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid #ccc;
    background: #fff;
    color: #666;
  }
  .filter-toggle.on.status-missing { border-color: #c0392b; color: #c0392b; background: #fdecea; }
  .filter-toggle.on.status-low { border-color: #b8860b; color: #8a6500; background: #fff6e5; }
  .filter-toggle.on.status-good { border-color: #1e7a3c; color: #1e7a3c; background: #eafaf0; }

  h2.division { font-size: 17px; margin: 26px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #1a1a1a; }
  #ministries-report table { margin-bottom: 8px; }
  h3.country { font-size: 14.5px; margin: 16px 0 6px; color: #333; }
  ul.entry-list { list-style: none; margin: 0 0 4px; padding: 0; font-size: 13.5px; }
  ul.entry-list li.entry { padding: 6px 0; border-bottom: 1px solid #eee; }
  .entry-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .entry-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .status-dot.status-missing { background: #c0392b; }
  .status-dot.status-low { background: #d4a017; }
  .status-dot.status-good { background: #2e8b45; }
  .who { color: #1a1a1a; }
  .who .role { color: #888; font-style: italic; margin-left: 4px; }
  .who-btn { background: none; border: none; padding: 0; font: inherit; cursor: pointer; text-align: left; }
  .who-btn:hover .who { text-decoration: underline; }
  .who-btn:disabled { cursor: default; pointer-events: none; }
  .kind-tag { display: inline-block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #888; width: 42px; flex: 0 0 auto; }
  .dims { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; color: #888; margin-left: 8px; }
  .dims.status-good { color: #1e7a3c; }
  .dims.status-low { color: #b8860b; }
  .entry-actions { flex: 0 0 auto; display: flex; gap: 6px; }
  .preview img { display: block; max-width: 200px; max-height: 140px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; margin: 8px 0 2px; cursor: zoom-out; }
  #images-report .entry[data-status="missing"].hide-status,
  #images-report .entry[data-status="low"].hide-status,
  #images-report .entry[data-status="good"].hide-status { display: none; }

  .status-text { color: #888; font-style: italic; }
</style>
</head>
<body>

  <h1>Young Life University International Admin <a href="help.html" target="_blank" rel="noopener" class="help-link" title="Help" aria-label="Help">&#9432;</a></h1>

  <div id="banner" class="banner" hidden></div>

  <div id="deploy-toast" class="deploy-toast" hidden>
    <span id="deploy-toast-spinner" class="deploy-toast-spinner"></span>
    <span id="deploy-toast-text" class="deploy-toast-text"></span>
    <button type="button" id="deploy-toast-dismiss" class="deploy-toast-dismiss" aria-label="Dismiss">&times;</button>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="ministries">Ministries</button>
    <button type="button" class="tab-btn" data-tab="images">Images</button>
  </div>

  <section id="tab-ministries" class="tab-panel">
    <div class="toolbar">
      <div class="toolbar-left">
        <span id="ministries-count" class="status-text"></span>
        <div class="ministries-search-wrap">
          <input type="text" id="ministries-search" class="ministries-search" placeholder="Search city, country, or staff…" autocomplete="off">
          <button type="button" id="ministries-search-clear" class="ministries-search-clear" aria-label="Clear search" hidden>&times;</button>
        </div>
      </div>
      <button type="button" class="btn" id="add-ministry-btn">+ Add New Ministry</button>
    </div>
    <div id="ministries-report"></div>
  </section>

  <section id="tab-images" class="tab-panel" hidden>
    <div class="guidance" id="images-guidance"></div>
    <div class="summary" id="images-summary">
      <span class="status-text">Checking images…</span>
    </div>
    <div class="filter-bar" id="images-filter-bar"></div>
    <div id="images-report"></div>
  </section>

  <dialog id="ministry-dialog">
    <form id="ministry-form" method="dialog">
      <div class="dialog-header">
        <h2 id="dialog-title">Add Ministry</h2>
        <div class="dialog-header-actions">
          <button type="button" class="btn secondary" id="dialog-cancel-btn" hidden>Cancel</button>
          <button type="button" class="btn" id="dialog-close-btn">Update</button>
        </div>
      </div>
      <div class="dialog-body">
        <div class="field-row">
          <div class="field">
            <label for="field-city">City / Area</label>
            <input type="text" id="field-city" required>
          </div>
          <div class="field">
            <label for="field-country">Country</label>
            <input type="text" id="field-country" list="country-list" required>
            <datalist id="country-list"></datalist>
            <div class="field-error" id="country-error" hidden></div>
          </div>
        </div>
        <div class="latlng-lookup">
          <button type="button" class="btn secondary btn-small" id="latlng-lookup-btn">Look Up Latitude and Longitude from City &amp; Country</button>
          <span class="latlng-lookup-status" id="latlng-lookup-status"></span>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="field-lat">Latitude</label>
            <input type="number" step="any" id="field-lat" required>
          </div>
          <div class="field">
            <label for="field-lng">Longitude</label>
            <input type="number" step="any" id="field-lng" required>
          </div>
          <div class="field pin-placement-btn-col">
            <label>&nbsp;</label>
            <button type="button" class="btn secondary btn-small" id="pin-placement-btn" hidden>Adjust Pin Placement</button>
          </div>
        </div>
        <div id="pin-placement-map" class="pin-placement-map" hidden></div>

        <div class="field">
          <label>Ministry Photos</label>
          <div class="ministry-photos-dropzone" id="ministry-photos-dropzone">
            <div class="ministry-photos" id="ministry-photos"></div>
            <div class="ministry-photos-add-row">
              <button type="button" class="btn secondary btn-small" id="add-ministry-photo-btn">+ Add Photo(s)</button>
              <span class="ministry-photos-drop-hint">or drop photos here</span>
            </div>
          </div>
          <input type="file" id="ministry-photo-input" class="hidden-file-input" accept="image/*" multiple>
          <div class="ministry-photo-hint">First photo is the main one shown on the map popup — use the arrows to reorder. Recommended: at least 1200×900px (4:3).</div>
        </div>

        <div class="field">
          <label for="field-blurb">Ministry Blurb</label>
          <textarea id="field-blurb"></textarea>
        </div>

        <div class="field field-checkbox">
          <label for="field-is-developing">
            <input type="checkbox" id="field-is-developing">
            Developing (shows as a dot on the map instead of a star)
          </label>
        </div>

        <div class="field">
          <label>Staff</label>
          <div class="repeatable-group" id="staff-group"></div>
          <button type="button" class="btn secondary btn-small" id="add-staff-btn">+ Add Staff Member</button>
        </div>

        <div class="field">
          <label>Universities</label>
          <div class="repeatable-group" id="universities-group"></div>
          <button type="button" class="btn secondary btn-small" id="add-university-btn">+ Add University</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="move-staff-dialog">
    <div class="dialog-header">
      <h2 id="move-staff-title">Move to Ministry</h2>
      <div class="dialog-header-actions">
        <button type="button" class="btn secondary" id="move-staff-cancel-btn">Cancel</button>
      </div>
    </div>
    <div class="dialog-body">
      <input type="text" id="move-staff-search" class="move-staff-search" placeholder="Search city or country…" autocomplete="off">
