<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministry Report — Young Life University International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ---------- Screen-only chrome (button, status) — never printed ---------- */
  body {
    font-family: 'EB Garamond', Georgia, serif;
    max-width: 900px;
    margin: 48px auto;
    padding: 0 20px 80px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1, h2, h3 { font-family: 'Cinzel', 'Times New Roman', serif; }

  /* Download/Regenerate float over the report instead of taking up space
     in the flow — this page has no other chrome above the report now. */
  .floating-controls {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(250, 250, 250, 0.85);
    backdrop-filter: blur(4px);
  }
  .btn {
    font: inherit;
    font-size: 15px;
    padding: 11px 20px;
    border-radius: 6px;
    border: 1px solid #1a1a1a;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.secondary { background: #fff; color: #1a1a1a; }
  .btn[hidden] { display: none; }
  .status { font-size: 13px; color: #666; max-width: 220px; }
  .status.error { color: #c0392b; }

  /* Shown as soon as the page loads (generation starts automatically —
     see reports2.js) and dismissed once the report is ready. Plain
     absolutely-positioned overlay, not a native dialog — those block
     further script execution, which this page needs to keep running
     while it waits on the report to build. */
  #loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(250, 250, 250, 0.92);
  }
  #loading-overlay[hidden] { display: none; }
  .loading-box {
    text-align: center;
    padding: 28px 36px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .loading-spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 14px;
    border: 3px solid #ddd;
    border-top-color: #1a1a1a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: #333; }
  .loading-text.error { color: #c0392b; }
  #retry-btn { margin-top: 16px; }

  /* Hidden until reports2.js has finished building it. */
  #report-output {
    display: none;
    margin-top: 32px;
  }
  #report-output.ready { display: block; }

  /* ---------- Report content (built into #report-output by reports2.js's
     buildReportHtml()) ---------- */
  .report-map-title {
    font-size: 24px;
    text-align: center;
    margin: 0 0 4px;
  }
  .report-generated-date {
    font-size: 18px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #666;
    margin: 0 0 14px;
  }
  .report-metrics {
    display: flex;
    gap: 36px;
    justify-content: center;
    width: 80%;
    margin: 24px auto 28px;
  }
  .report-metric {
    flex: 0 0 90px;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px solid #1a1a1a;
    border-radius: 8px;
    background: none;
  }
  .report-metric-label { font-size: 11px; color: #1a1a1a; text-transform: uppercase; letter-spacing: 0.03em; }
  .report-metric-num { font-size: 24px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
  .report-map-shot { max-width: 100%; border: 1px solid #ccc; display: block; }

  /* Every division (including the first, right after the metrics page)
     starts on its own fresh printed page — native break-before, reliable
     in every browser. Unlike bigtime/reports/ (plain CSS pagination,
     no page-aware footer possible), this page's PDF isn't actually
     produced by printing this document at all — worker/routes/report-pdf.js
     calls Puppeteer's page.pdf() once per [data-section] (see
     reports2.js's header comment) with a real per-section footer. This
     break-before is only what a literal Ctrl+P of this on-screen preview
     would look like; it doesn't drive the real PDF's pagination. */
  .division-section { break-before: page; }
  .division-title {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 80%;
    margin: 0 auto 14px;
  }
  .division-title-report-name { font-size: 13px; font-weight: 400; letter-spacing: 0.03em; text-transform: uppercase; }
  .division-title-division-name { font-size: 24px; }
  .division-map-shot {
    display: block;
    max-width: 100%;
    margin: 0 auto 20px;
    border: 1px solid #ccc;
  }
  /* Ministry areas always start on their own fresh page after the
     division's title/map/metrics. */
  .division-areas { break-before: page; }

  .ministry-area {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 16px;
    margin-bottom: 6px;
    break-inside: avoid;
  }
  .ministry-area-title {
    grid-column: 1 / -1;
    font-size: 15px;
    font-weight: 700;
    margin: 14px 0 4px;
  }
  .ministry-area-photo {
    width: 220px;
    height: 165px;
    object-fit: cover;
    border-radius: 3px;
    background: #eee;
  }
  .ministry-area.no-photo { grid-template-columns: 1fr; }
  .ministry-area-blurb { font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
  .ministry-staff { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; }
  .ministry-staff-item { width: 74px; text-align: center; }
  .ministry-staff-photo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #1a1a1a;
    margin: 0 auto 4px;
    display: block;
  }
  .ministry-staff-photo-fallback {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid #1a1a1a;
    margin: 0 auto 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .ministry-staff-name { font-size: 10.5px; font-weight: 600; line-height: 1.2; }
  .ministry-staff-role { font-size: 9.5px; color: #666; line-height: 1.2; }
  .ministry-universities { font-size: 12px; color: #333; }
  .ministry-universities-label { font-weight: 700; }

  /* Plain, native browser print page geometry — for a manual Ctrl+P of
     this on-screen preview only. The real PDF (worker/routes/report-pdf.js)
     doesn't depend on this rule at all: it passes explicit
     format:'Letter', landscape:true, and matching margins straight to
     Puppeteer's page.pdf() instead of preferCSSPageSize, since Chrome's
     PDF engine choked on this rule's bare `size: landscape` keyword
     (no explicit dimensions) and produced a garbage page size. Kept in
     sync by hand — if this changes, update report-pdf.js's page.pdf()
     options to match. */
  @page {
    size: landscape;
    margin: 14mm 16mm;
  }

  @media print {
    body { max-width: none; margin: 0; padding: 0; background: #fff; }
    .floating-controls, .status, #loading-overlay { display: none !important; }
    #report-output { margin: 0; }
    .report-map-shot { max-width: 100%; max-height: 460px; width: auto; margin: 0 auto; }
    .division-map-shot { max-width: 100%; max-height: 440px; width: auto; margin: 0 auto 20px; }
  }

  /* Extra on-screen breathing room that would only waste page space when
     printed — kept in its own screen-only block so it never leaks into
     the @media print rules above (which already reset most of this). */
  @media screen {
    .ministry-area-title { margin-top: 30px; }
    .division-section { margin-top: 44px; }
    .division-section:first-of-type { margin-top: 0; }
    .report-metrics { margin-bottom: 40px; }
  }
</style>
</head>
<body>

<div class="floating-controls">
  <button type="button" class="btn" id="download-btn" hidden>Download PDF</button>
  <button type="button" class="btn secondary" id="regenerate-btn" hidden>Regenerate</button>
  <div class="status" id="download-status" hidden></div>
</div>

<div id="report-output"></div>

<div id="loading-overlay">
  <div class="loading-box">
    <div class="loading-spinner" id="loading-spinner"></div>
    <div class="loading-text" id="loading-text">Loading ministry data…</div>
    <button type="button" class="btn secondary" id="retry-btn" hidden>Try Again</button>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script src="../../js/config.js"></script>
<script src="../../vendor/papaparse/papaparse.min.js"></script>
<script type="module" src="reports2.js"></script>
</body>
</html>
