<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Division Maps — Young Life University International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'EB Garamond', Georgia, serif;
    max-width: 900px;
    margin: 48px auto;
    padding: 0 20px 80px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1, h2 { font-family: 'Cinzel', 'Times New Roman', serif; }

  .floating-controls {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(250, 250, 250, 0.85);
    backdrop-filter: blur(4px);
  }
  .btn {
    font: inherit;
    font-size: 15px;
    padding: 11px 20px;
    border-radius: 6px;
    border: 1px solid #1a1a1a;
    background: #fff;
    color: #1a1a1a;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .btn[hidden] { display: none; }

  /* Shown as soon as the page loads (generation starts automatically —
     see maps.js) and dismissed once every map has been captured. Plain
     absolutely-positioned overlay, not a native dialog — those block
     further script execution, which this page needs to keep running
     while it waits on each screenshot. */
  #loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(250, 250, 250, 0.92);
  }
  #loading-overlay[hidden] { display: none; }
  .loading-box {
    text-align: center;
    padding: 28px 36px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .loading-spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 14px;
    border: 3px solid #ddd;
    border-top-color: #1a1a1a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: #333; }
  .loading-text.error { color: #c0392b; }
  #retry-btn { margin-top: 16px; }

  /* Hidden until maps.js has finished building it. */
  #maps-output {
    display: none;
    margin-top: 32px;
  }
  #maps-output.ready { display: block; }

  .map-block { margin-bottom: 56px; }
  .map-title { font-size: 24px; text-align: center; margin: 0 0 14px; }
  .map-shot { max-width: 100%; border: 1px solid #ccc; display: block; margin: 0 auto; }
</style>
</head>
<body>

<div class="floating-controls">
  <button type="button" class="btn" id="regenerate-btn" hidden>Regenerate</button>
</div>

<div id="maps-output"></div>

<div id="loading-overlay">
  <div class="loading-box">
    <div class="loading-spinner" id="loading-spinner"></div>
    <div class="loading-text" id="loading-text">Capturing world map…</div>
    <button type="button" class="btn" id="retry-btn" hidden>Try Again</button>
  </div>
</div>

<script src="../../js/config.js"></script>
<script type="module" src="maps.js"></script>
</body>
</html>
